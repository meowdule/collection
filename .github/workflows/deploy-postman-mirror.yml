name: Deploy Postman Mirror

on:
  workflow_dispatch:
    inputs:
      include_json:
        description: 'Include .json files from series/postman/vol-01-start/publish-assets'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'series/postman/**'
      - '_shared/guide/**'
      - '.github/workflows/deploy-postman-mirror.yml'

jobs:
  mirror-to-collection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo (A)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Install scripts dependencies
        run: npm install
        working-directory: scripts

      - name: Build publish payload
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.include_json }}" = "true" ]; then
            node scripts/build-postman-publish.mjs --out-dir .deploy-mirror --include-json
          else
            node scripts/build-postman-publish.mjs --out-dir .deploy-mirror
          fi
          PDF_COUNT=$(find .deploy-mirror/postman -type f -name '*.pdf' | wc -l)
          echo "PDF count: $PDF_COUNT"
          if [ "$PDF_COUNT" -lt 1 ]; then
            echo "ERROR: No PDF files in .deploy-mirror/postman"
            exit 1
          fi

      - name: Build flipbook viewer for GitHub Pages
        run: npm run build
        working-directory: app
        env:
          VITE_BASE_PATH: /collection/

      - name: Checkout destination repo (B)
        uses: actions/checkout@v4
        with:
          repository: TBELL-ref/collection
          token: ${{ secrets.TBELLAI_COLLECTION_TOKEN }}
          path: b-repo

      - name: Mirror postman payload (delete removed files)
        run: |
          mkdir -p b-repo/postman
          rsync -av --delete .deploy-mirror/postman/ b-repo/postman/

      - name: Sync viewer to destination root (keep postman/)
        run: |
          rm -rf b-repo/assets
          find b-repo -maxdepth 1 -type f \( -name 'index.html' -o -name 'vite.svg' -o -name 'favicon.svg' \) -delete 2>/dev/null || true
          rsync -av app/dist/ b-repo/
          touch b-repo/.nojekyll

      - name: Commit and push when changed
        run: |
          cd b-repo
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to deploy."
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: mirror postman artifacts from source"
          git push
